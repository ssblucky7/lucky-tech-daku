name: finalapp
description: "A healthcare app for managing appointments and medication reminders."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.1
  image_picker: ^1.0.7
  geolocator: ^10.1.0
  path_provider: ^2.1.2
  url_launcher: ^6.2.5
  device_info_plus: ^10.1.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.1
  firebase_core: ^3.10.0
  flutter_dotenv: ^5.1.0
  file_picker: ^8.0.0+1
  http: ^1.1.0
  crypto: ^3.0.3
  uuid: ^4.5.1
  share_plus: ^7.2.2
  qr_flutter: ^4.1.0
  # flutter_tts: ^4.0.2
  # speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
